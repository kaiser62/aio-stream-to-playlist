[package]
name = "companion-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Stremio-addon client, TorBox API and playlist logic shared by all platforms"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
urlencoding = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
